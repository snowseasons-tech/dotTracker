# Requires an externally managed PostgreSQL 17 + PostGIS 3.5 database and a TLS reverse proxy.
# Copy .env.production.example to .env.production and replace every placeholder.
services:
  migrate:
    build: .
    env_file: .env.production
    environment:
      APP_ENV: production
      ALLOW_DEMO_SEED: "false"
    command: ["python", "migrate.py"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["migration"]
  cdot-stations:
    build: .
    env_file: .env.production
    environment:
      APP_ENV: production
      ALLOW_DEMO_SEED: "false"
    command: ["python", "scripts/load_cdot_stations.py", "--data-dir", "/data"]
    volumes: ["../data:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["migration"]
  api:
    build: .
    env_file: .env.production
    environment:
      APP_ENV: production
      ALLOW_DEMO_SEED: "false"
      MIGRATION_DATABASE_URL: null
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
