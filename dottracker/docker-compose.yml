services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: dottracker
      POSTGRES_USER: dottracker
      POSTGRES_PASSWORD: dottracker_dev
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dottracker -d dottracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./app:/app/app"]
volumes:
  postgres_data:
